<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kairós — KPI</title>
<meta name="apple-mobile-web-app-title" content="Kairós KPI">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    color-scheme:dark;
    --bg:#0a0911; --cardbg:#131020; --line:#251d3a; --side:#0c0a15;
    --ink:#eae6f5; --muted:#948da6; --accent:#a78bfa; --accent-dim:#251345;
    --bad:#f87171; --warn:#fbbf24; --ok:#4ade80;
    --bg2:#1a1530; --raise:#17132a; --accent-ink:#140b26; --gold:#e2b866;
    --line-hover:#3a2f5c;
    --r-s:8px; --r-m:12px; --r-l:16px; --t:.15s ease;
    --card-grad:linear-gradient(160deg, #161226 0%, #100d1a 55%, #0e0b17 100%);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { background:radial-gradient(1100px 550px at 85% -10%, rgba(139,92,246,.035), transparent 60%), var(--bg);
    color:var(--ink); font:15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    padding-bottom:env(safe-area-inset-bottom); }
  main { max-width:980px; margin:0 auto; padding:18px 16px 60px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 2px 14px; }
  .logo { font-size:19px; font-weight:750; letter-spacing:.06em; }
  .logo span { color:var(--accent); }
  .logosub { color:var(--muted); font-size:9.5px; letter-spacing:.42em; font-weight:650; margin-top:1px; }
  .hello { color:var(--muted); font-size:13px; text-align:right; }
  h1 { font-size:21px; letter-spacing:-.02em; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .card { background:var(--card-grad); border:1px solid var(--line); border-radius:var(--r-l); padding:16px; margin-top:14px; }
  .card h2 { font-size:12px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin-bottom:10px; text-transform:uppercase; }
  .bandeau { border-radius:var(--r-m); padding:12px 14px; margin-top:14px; font-weight:600; font-size:14px; border:1px solid; }
  .bandeau.rouge { background:#2a0f12; border-color:#5b1a1f; color:#fca5a5; }
  .bandeau.vert { background:#0e2117; border-color:#1d4230; color:#86efac; }
  .bandeau.neutre { background:var(--raise); border-color:var(--line); color:var(--muted); font-weight:500; }
  .dose { display:flex; flex-wrap:wrap; gap:10px; }
  .dose .gros { flex:1 1 100%; background:var(--accent-dim); border:1px solid var(--line-hover); border-radius:var(--r-m); padding:14px 16px; }
  .dose .gros .n { font-size:34px; font-weight:800; color:var(--accent); letter-spacing:-.02em; }
  .dose .gros .l { color:var(--ink); font-size:13.5px; font-weight:600; margin-top:2px; }
  .dose .petit { flex:1 1 140px; background:var(--raise); border:1px solid var(--line); border-radius:var(--r-m); padding:10px 12px; }
  .dose .petit .n { font-size:20px; font-weight:700; }
  .dose .petit .l { color:var(--muted); font-size:11.5px; margin-top:1px; }
  .barre { background:#1e1930; border-radius:99px; height:10px; overflow:hidden; margin-top:8px; }
  .barre > div { height:100%; background:linear-gradient(90deg, var(--accent), #7c5cf0); border-radius:99px; transition:width .4s ease; }
  .barreinfo { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:6px; }
  .barreinfo b { color:var(--ink); }
  form .ligne { display:grid; grid-template-columns:1fr 92px; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
  form .ligne:last-of-type { border-bottom:none; }
  form label { font-size:14px; }
  form label small { display:block; color:var(--muted); font-size:11.5px; }
  input[type=number], input[type=time], input[type=date], textarea, select {
    background:var(--raise); border:1px solid var(--line); color:var(--ink); border-radius:var(--r-s);
    padding:9px 10px; font-size:16px; font-family:inherit; width:100%; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:64px; resize:vertical; }
  .btn { background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--r-m);
    padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; width:100%; margin-top:12px; }
  .btn:active { transform:scale(.985); }
  .btn.sec { background:var(--raise); color:var(--ink); border:1px solid var(--line); font-weight:600; }
  .btn[disabled] { opacity:.55; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:700; }
  .pill.ok { background:#0e2117; color:#86efac; }
  .pill.non { background:#2a0f12; color:#fca5a5; }
  .pill.att { background:#241d10; color:var(--warn); }
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; margin-top:14px; }
  .mcard { background:var(--card-grad); border:1px solid var(--line); border-radius:var(--r-l); padding:14px; cursor:pointer; transition:border-color var(--t); }
  .mcard:hover { border-color:var(--line-hover); }
  .mcard .tete { display:flex; justify-content:space-between; align-items:center; }
  .mcard .nom { font-weight:750; font-size:16px; }
  .mcard .obj { color:var(--gold); font-size:13px; font-weight:700; }
  .mcard .doseinfo { color:var(--muted); font-size:12.5px; margin-top:8px; }
  .mcard .doseinfo b { color:var(--ink); }
  .mcard .bloc { color:var(--warn); font-size:12px; margin-top:6px; font-style:italic; overflow:hidden; text-overflow:ellipsis; }
  .onglets { display:flex; gap:8px; margin-top:14px; overflow-x:auto; scrollbar-width:none; }
  .onglets::-webkit-scrollbar { display:none; }
  .onglets button { border:1px solid var(--line); background:var(--cardbg); padding:7px 15px; border-radius:99px;
    cursor:pointer; font-size:13.5px; color:var(--ink); font-family:inherit; flex:none; }
  .onglets button.active { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
  .overlay { position:fixed; inset:0; background:rgba(5,4,10,.72); backdrop-filter:blur(3px); z-index:40;
    display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto; }
  .ofiche { background:var(--bg); border:1px solid var(--line-hover); border-radius:var(--r-l); max-width:760px; width:100%; padding:18px; margin:12px 0 40px; }
  .fermer { float:right; background:var(--raise); border:1px solid var(--line); color:var(--muted); border-radius:99px;
    width:32px; height:32px; font-size:16px; cursor:pointer; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:#1d1731; border:1px solid var(--line-hover);
    color:var(--ink); border-radius:99px; padding:11px 20px; font-size:14px; font-weight:600; z-index:60; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .lock { max-width:420px; margin:14vh auto 0; text-align:center; padding:0 18px; }
  .lock .logo { font-size:26px; }
  .lock p { color:var(--muted); margin:14px 0; }
  .lock input { text-align:center; }
  .liens td button { background:var(--raise); border:1px solid var(--line); color:var(--ink); border-radius:var(--r-s);
    padding:5px 12px; cursor:pointer; font-family:inherit; font-size:12.5px; }
  .regl .ligne { display:grid; grid-template-columns:1fr 110px; gap:8px; align-items:center; padding:6px 0; }
  .cache { display:none !important; }
  .note { color:var(--muted); font-size:12.5px; margin-top:8px; line-height:1.5; }
  @media (max-width:560px) {
    main { padding:12px 10px 60px; }
    .dose .gros .n { font-size:29px; }
  }
</style>
</head>
<body>
<main id="racine"></main>
<script src="app.js?v=1"></script>
</body>
</html>
